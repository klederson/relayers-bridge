name: Publish website
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tests/site-browser.mjs'
      - 'tests/tutorials-browser.mjs'
      - 'scripts/build-tutorials.mjs'
      - 'tests/website-analytics.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:tutorials
      - name: Check tutorials and screenshots
        run: npm run test:tutorials
        env:
          SITE_BROWSER_CHANNEL: chrome
      - name: Check website with the browser already on the runner
        run: npm run test:site
        env:
          SITE_BROWSER_CHANNEL: chrome
      - name: Check website analytics without sending live statistics
        run: npm run test:analytics
        env:
          SITE_BROWSER_CHANNEL: chrome
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

