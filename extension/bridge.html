<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RELAYERS Bridge</title><link rel="stylesheet" href="bridge.css"><script type="module" src="bridge-ui.js"></script></head><body><main><header><div class="bridge-brand"><img src="icons/48.png" width="36" height="36" alt=""><div><strong>RELAYERS Bridge</strong><small>WhatsApp</small></div></div><a href="https://github.com/klederson/relayers-bridge" target="_blank" rel="noopener noreferrer">GitHub ↗</a></header><h1 data-ui="heading">Your WhatsApp. Connected.</h1><p data-ui="intro"></p><aside data-ui="disclosure"></aside><section id="login"><div class="account-links"><a href="https://panel.relayers.app/login" target="_blank" rel="noopener noreferrer" data-ui="loginAccount"></a><a href="https://relayers.app/register" target="_blank" rel="noopener noreferrer" data-ui="registerAccount"></a></div><details><summary data-ui="serverSettings"></summary><label for="server" data-ui="server"></label><input id="server" type="url" value="https://api.relayers.app" autocomplete="url"></details><button id="connect" type="button" data-ui="connect"></button><div id="pairing" hidden><p data-ui="enterCode"></p><strong id="user-code"></strong><a id="verify" href="#" target="_blank" rel="noopener noreferrer" data-ui="verify"></a></div></section><section id="setup" hidden><p class="linked-note" data-ui="linkedHelp"></p><label for="whatsapp" data-ui="account"></label><select id="whatsapp"></select><p id="account-id"></p><label for="chat-search" data-ui="chooseChats"></label><input type="search" id="chat-search" autocomplete="off" data-ui-placeholder="search"><div id="chats" role="group" aria-label="Conversations"></div><p id="selected-count"></p><label class="check"><input id="incoming" type="checkbox"><span data-ui="incoming"></span></label><p class="help" data-ui="incomingHelp"></p><label class="check"><input id="outgoing" type="checkbox"><span data-ui="outgoing"></span></label><p class="help" data-ui="outgoingHelp"></p><label class="check consent"><input id="consent" type="checkbox"><span data-ui="consent"></span></label><p class="help" data-ui="creation"></p></section><section id="whatsapp-settings" hidden>
<div class="settings-heading"><p class="settings-kicker">RELAYERS + WhatsApp</p><h2 data-ui="settingsTitle"></h2><p class="help" data-ui="settingsIntro"></p></div>
<div id="filter-cards"></div>
<fieldset id="destination-settings" class="destination-card"><legend data-ui="destinationTitle"></legend>
<label for="destination-kind" data-ui="destinationKind"></label><select id="destination-kind"><option value="none" data-ui="destinationNone"></option><option value="remote" data-ui="destinationRemote"></option><option value="local" data-ui="destinationLocal"></option></select>
<div id="destination-fields" hidden><label for="destination-url" data-ui="destinationUrl"></label><input id="destination-url" type="url" maxlength="2048" autocomplete="off" spellcheck="false"><div id="destination-device-field" hidden><label for="destination-device" data-ui="destinationDevice"></label><select id="destination-device"></select><button id="load-devices" type="button" class="subtle" data-ui="loadDevices"></button></div></div><p class="help" data-ui="destinationHelp"></p></fieldset>
<button id="start" type="button" data-ui="start"></button>
<div id="settings-existing-controls" hidden><p class="help" data-ui="settingsScope"></p><label class="check consent"><input id="settings-consent" type="checkbox"><span data-ui="settingsConsent"></span></label><p class="help" data-ui="settingsSaveHelp"></p><button id="save-settings" type="button" data-ui="saveSettings"></button></div>
</section><section id="connection" hidden><h2 data-ui="connection"></h2><button id="edit-settings" type="button" class="configure-button" data-ui="editSettings"></button><p id="connection-state" role="status"></p><p id="queue-count"></p><p id="application-state" class="help"></p><p id="last-result" role="status" aria-live="polite"></p><p id="connection-warning" role="status"></p><div class="actions"><button id="pause" type="button" data-ui="pause"></button><button id="resume" type="button" data-ui="resume"></button><button id="disconnect" class="danger" type="button" data-ui="disconnect"></button></div><p class="help" data-ui="pauseHelp"></p><div id="rebind"><label for="rebind-tab" data-ui="rebindLabel"></label><select id="rebind-tab"></select><button id="rebind-button" type="button" data-ui="rebind"></button><p class="help" data-ui="rebindHelp"></p></div><details id="integration"><summary data-ui="integration"></summary><p data-ui="integrationHelp"></p><p>IN <code id="in-url"></code></p><button id="copy-in" type="button" class="subtle" data-ui="copyIncoming"></button><p>OUT <code id="out-url"></code></p><button id="copy-out" type="button" class="subtle" data-ui="copyOutgoing"></button><div id="out-secret-field"><label for="out-secret" data-ui="secret"></label><input type="password" id="out-secret" readonly autocomplete="off"><button id="show-secret" type="button" data-ui="showSecret"></button><p class="help" data-ui="secretHelp"></p></div><label for="example" data-ui="example"></label><textarea id="example" readonly rows="12"></textarea></details></section><p id="status" role="status" aria-live="polite"></p><details id="diagnostics" hidden><summary data-ui="diagnostics"></summary><code id="error-code"></code></details><footer><p data-ui="limits"></p><a href="https://github.com/klederson/relayers-bridge/blob/main/PRIVACY.md" target="_blank" rel="noopener noreferrer" data-ui="privacy"></a><p data-ui="independent"></p></footer></main></body></html>
